        </div>

        <!-- شاشة اللعب -->

                    points: 30
                }

        // متغيرات اللعبة
        let playerData = {};
        let currentQ = 0;
        let score = 0;
        let questions = []; // سيتم تعبئتها بناءً على التخصص المختار

        // بدء اللعب
        document.getElementById('startBtn').addEventListener('click', () => {
            const selectedType = document.getElementById('playerType').value;
            playerData = {
                name: document.getElementById('playerName').value || "لاعب مجهول",
                link: document.getElementById('karboLink').value || "#",
                type: selectedType,
                stage: document.getElementById('stageSelect').value,
                date: new Date().toISOString()
            };
            
            // ✅ جلب الأسئلة والأصوات الخاصة بالتخصص المختار فقط
            questions = QUESTIONS_LIBRARY[selectedType] || [];

            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('gameScreen').classList.remove('hidden');
            document.getElementById('currentStage').textContent = playerData.stage;
            document.getElementById('currentType').textContent = playerData.type;
            loadQuestion();
        });

        // تحميل السؤال
        function loadQuestion() {
            const q = questions[currentQ];
            document.getElementById('qNumber').textContent = currentQ + 1;
            document.getElementById('questionText').textContent = q.text;
            document.getElementById('audioPlayer').src = q.audio;
            document.getElementById('progressBar').style.width = `${(currentQ+1)*20}%`;
            
            const container = document.getElementById('optionsContainer');
            container.innerHTML = '';
            q.options.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn bg-dark/70 hover:bg-neonblue/20 border-2 border-neonblue/30 rounded-xl p-4 text-lg transition-all';
                btn.textContent = opt;
                btn.onclick = () => checkAnswer(i, btn);
                container.appendChild(btn);
            });

            document.getElementById('nextBtn').classList.add('hidden');
        }

        // التحقق من الإجابة
        function checkAnswer(idx, btn) {
            const q = questions[currentQ];
            const allBtns = document.querySelectorAll('.option-btn');
            allBtns.forEach(b => b.disabled = true);

            if(idx === q.correct) {
                btn.classList.remove('border-neonblue/30');
                btn.classList.add('border-green-500', 'bg-green-500/20');
                score += q.points;
                document.getElementById('scoreDisplay').textContent = score;
            } else {
                btn.classList.remove('border-neonblue/30');
                btn.classList.add('border-red-500', 'bg-red-500/20');
                allBtns[q.correct].classList.remove('border-neonblue/30');
                allBtns[q.correct].classList.add('border-green-500', 'bg-green-500/20');
            }

            document.getElementById('nextBtn').classList.remove('hidden');
        }

        // السؤال التالي
        document.getElementById('nextBtn').addEventListener('click', () => {
            currentQ++;
            if(currentQ < questions.length) {
                loadQuestion();
            } else {
                showResult();
            }
        });

        // عرض النتيجة النهائية
        function showResult() {
            document.getElementById('gameScreen').classList.add('hidden');
            document.getElementById('resultScreen').classList.remove('hidden');
            document.getElementById('resName').textContent = playerData.name;
            document.getElementById('resType').textContent = playerData.type;
            document.getElementById('resStage').textContent = playerData.stage;
            document.getElementById('finalScore').textContent = score;
        }

        // حفظ النتيجة في Firebase و LocalStorage
        function saveResult() {
            const resultData = { ...playerData, score: score };
            
            // حفظ في قاعدة البيانات
            db.ref('results/' + Date.now()).set(resultData);
            
            // حفظ محلي
            const old = JSON.parse(localStorage.getItem('lb_v2') || '[]');
            old.push(resultData);
            localStorage.setItem('lb_v2', JSON.stringify(old));
            
            alert("✅ تم حفظ النتيجة بنجاح!");
        }

        // تشغيل الصوت
        document.getElementById('playAudioBtn').addEventListener('click', () => {
            document.getElementById('audioPlayer').play();
        });
    </script>
</body>
</html>
