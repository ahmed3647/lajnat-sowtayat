<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏆 لوحة المتصدرين — لجنة الصوتيات</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #07060f;
  --surface: #0f0e1e;
  --card: #13122a;
  --border: rgba(255,255,255,0.07);
  --gold:   #ffd600;
  --silver: #c0c0d0;
  --bronze: #cd7f32;
  --accent: #e040fb;
  --accent2: #00e5ff;
  --text: #f0f0ff;
  --muted: #6b7280;
  --green: #00e676;
}

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: 'Tajawal', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* Stars BG */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: radial-gradient(1.5px 1.5px at 10% 20%, rgba(255,255,255,.35) 0%, transparent 100%),
    radial-gradient(1px 1px at 30% 60%, rgba(255,255,255,.2) 0%, transparent 100%),
    radial-gradient(2px 2px at 60% 10%, rgba(255,255,255,.25) 0%, transparent 100%),
    radial-gradient(1px 1px at 80% 80%, rgba(255,255,255,.15) 0%, transparent 100%),
    radial-gradient(1.5px 1.5px at 50% 50%, rgba(255,255,255,.2) 0%, transparent 100%),
    radial-gradient(1px 1px at 90% 30%, rgba(255,255,255,.3) 0%, transparent 100%);
  background-size: 400px 400px;
  pointer-events: none;
  z-index: 0;
}

body::after {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse at 50% 0%, rgba(224,64,251,.14) 0%, transparent 55%),
    radial-gradient(ellipse at 0% 100%, rgba(0,229,255,.08) 0%, transparent 45%);
  pointer-events: none;
  z-index: 0;
}

.wrap { max-width: 800px; margin: 0 auto; padding: 20px 16px; position: relative; z-index: 1; }

/* ── HEADER ── */
header {
  text-align: center;
  padding: 40px 0 32px;
  animation: slideDown .7s cubic-bezier(.22,1,.36,1);
}

.trophy-icon {
  font-size: 3.5rem;
  display: block;
  margin-bottom: 10px;
  filter: drop-shadow(0 0 20px rgba(255,214,0,.6));
  animation: trophyFloat 3s ease-in-out infinite;
}

@keyframes trophyFloat {
  0%,100%{transform:translateY(0) rotate(-3deg)}
  50%{transform:translateY(-8px) rotate(3deg)}
}

header h1 {
  font-size: clamp(1.8rem, 5vw, 2.6rem);
  font-weight: 900;
  background: linear-gradient(135deg, #ffd600, #ff6d00, #e040fb);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 6px;
}

header p { color: var(--muted); font-size: .9rem; }

.header-link {
  display: inline-flex; align-items: center; gap: 8px;
  margin-top: 16px;
  padding: 10px 22px;
  border-radius: 50px;
  background: linear-gradient(135deg, rgba(224,64,251,.2), rgba(0,229,255,.15));
  border: 1px solid rgba(224,64,251,.35);
  color: var(--accent);
  text-decoration: none;
  font-weight: 700;
  font-size: .9rem;
  transition: all .3s;
}
.header-link:hover { transform: translateY(-2px); box-shadow: 0 0 20px rgba(224,64,251,.3); }

/* ── PODIUM ── */
.podium {
  display: flex;
  align-items: flex-end;
  justify-content: center;
  gap: 14px;
  margin: 30px 0;
  animation: fadeUp .7s ease .2s both;
}

.podium-slot {
  flex: 1;
  max-width: 180px;
  text-align: center;
}

.pod-card {
  border-radius: 18px 18px 4px 4px;
  padding: 18px 10px 14px;
  position: relative;
  overflow: hidden;
  transition: transform .3s;
}
.pod-card:hover { transform: translateY(-4px); }

.pod-card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(to bottom, rgba(255,255,255,.07), transparent);
  pointer-events: none;
}

.pod-1 { background: linear-gradient(160deg, rgba(255,214,0,.18), rgba(255,140,0,.08)); border: 1.5px solid rgba(255,214,0,.4); }
.pod-2 { background: linear-gradient(160deg, rgba(192,192,210,.12), rgba(150,150,180,.06)); border: 1.5px solid rgba(192,192,210,.3); }
.pod-3 { background: linear-gradient(160deg, rgba(205,127,50,.12), rgba(180,100,30,.06)); border: 1.5px solid rgba(205,127,50,.3); }

.pod-medal { font-size: 2rem; display: block; margin-bottom: 8px; }
.pod-name  { font-size: .85rem; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
.pod-score { font-size: 1.4rem; font-weight: 900; }
.pod-1 .pod-score { color: var(--gold); }
.pod-2 .pod-score { color: var(--silver); }
.pod-3 .pod-score { color: var(--bronze); }
.pod-game  { font-size: .7rem; color: var(--muted); margin-top: 4px; }

.pod-block {
  height: 60px;
  border-radius: 0 0 8px 8px;
  margin-top: 4px;
}
.pod-block-1 { background: linear-gradient(to bottom, rgba(255,214,0,.3), rgba(255,140,0,.1)); height: 70px; }
.pod-block-2 { background: linear-gradient(to bottom, rgba(192,192,210,.2), rgba(150,150,180,.05)); height: 50px; }
.pod-block-3 { background: linear-gradient(to bottom, rgba(205,127,50,.2), rgba(180,100,30,.05)); height: 40px; }

/* ── FILTER BAR ── */
.filter-bar {
  display: flex;
  gap: 8px;
  margin-bottom: 18px;
  flex-wrap: wrap;
  animation: fadeUp .5s ease .3s both;
}

.filter-btn {
  padding: 8px 18px;
  border-radius: 50px;
  border: 1.5px solid var(--border);
  background: var(--card);
  color: var(--muted);
  font-family: 'Tajawal', sans-serif;
  font-size: .85rem;
  font-weight: 700;
  cursor: pointer;
  transition: all .3s;
}
.filter-btn:hover { border-color: var(--accent); color: var(--text); }
.filter-btn.active { background: rgba(224,64,251,.15); border-color: var(--accent); color: var(--accent); }

/* ── LEADERBOARD TABLE ── */
.lb-wrap {
  background: var(--card);
  border: 1px solid rgba(224,64,251,.2);
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 0 40px rgba(224,64,251,.12);
  animation: fadeUp .5s ease .35s both;
  margin-bottom: 24px;
}

.lb-head {
  display: grid;
  grid-template-columns: 56px 1fr 110px 100px;
  gap: 0;
  padding: 12px 20px;
  background: rgba(224,64,251,.08);
  border-bottom: 1px solid var(--border);
  font-size: .75rem;
  color: var(--muted);
  letter-spacing: 1px;
  text-transform: uppercase;
}

.lb-entry {
  display: grid;
  grid-template-columns: 56px 1fr 110px 100px;
  gap: 0;
  padding: 15px 20px;
  border-bottom: 1px solid var(--border);
  align-items: center;
  transition: background .2s;
  animation: fadeUp .4s ease both;
}
.lb-entry:last-child { border-bottom: none; }
.lb-entry:hover { background: rgba(255,255,255,.025); }

.lb-entry.rank-1 { background: rgba(255,214,0,.05); }
.lb-entry.rank-2 { background: rgba(192,192,210,.04); }
.lb-entry.rank-3 { background: rgba(205,127,50,.04); }

.lb-rank { font-size: 1.15rem; font-weight: 900; text-align: center; }
.rank-1 .lb-rank { color: var(--gold); }
.rank-2 .lb-rank { color: var(--silver); }
.rank-3 .lb-rank { color: var(--bronze); }

.lb-player { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.lb-player-name { font-weight: 900; font-size: .95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lb-player-link { font-size: .72rem; }
.lb-player-link a { color: var(--accent2); text-decoration: none; }
.lb-player-link a:hover { text-decoration: underline; }

.lb-game { font-size: .78rem; color: var(--muted); }
.lb-score { font-size: 1.2rem; font-weight: 900; color: var(--gold); text-align: left; }

/* Stars for top 3 */
.star-row { display: flex; gap: 2px; margin-top: 3px; }
.star { font-size: .6rem; }

/* ── STATS BAR ── */
.stats-bar {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 12px;
  margin-bottom: 24px;
  animation: fadeUp .5s ease .4s both;
}

.stat-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 16px;
  text-align: center;
}
.stat-num { font-size: 1.7rem; font-weight: 900; color: var(--accent2); }
.stat-lbl { font-size: .75rem; color: var(--muted); margin-top: 3px; }

/* ── EMPTY STATE ── */
.empty {
  text-align: center;
  padding: 50px 20px;
  color: var(--muted);
}
.empty-icon { font-size: 3rem; display: block; margin-bottom: 12px; opacity: .5; }

/* ── BACK LINK ── */
.back-link {
  display: inline-flex; align-items: center; gap: 6px;
  color: var(--accent);
  text-decoration: none;
  font-weight: 700;
  font-size: .9rem;
  margin-bottom: 20px;
  transition: all .3s;
  animation: fadeUp .5s ease .1s both;
}
.back-link:hover { transform: translateX(4px); }

/* Animations */
@keyframes slideDown { from{opacity:0;transform:translateY(-20px)} to{opacity:1;transform:translateY(0)} }
@keyframes fadeUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }

/* Responsive */
@media(max-width:560px){
  .lb-head, .lb-entry { grid-template-columns: 44px 1fr 80px; }
  .lb-head > *:last-child, .lb-entry > *:last-child { display:none; }
  .lb-head > *:nth-child(3), .lb-entry > *:nth-child(3) { display: none; }
  .podium { gap: 8px; }
  .stats-bar { grid-template-columns: 1fr 1fr; }
}

/* Refresh animation */
.refreshing { animation: spin .6s linear; }
@keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
</style>
</head>
<body>
<div class="wrap">

  <!-- HEADER -->
  <header>
    <span class="trophy-icon">🏆</span>
    <h1>لوحة المتصدرين</h1>
    <p>لجنة الصوتيات — أمينو</p>
    <a class="header-link" href="games.html">🎮 العب الآن</a>
  </header>

  <!-- STATS -->
  <div class="stats-bar" id="statsBar">
    <div class="stat-card"><div class="stat-num" id="statPlayers">0</div><div class="stat-lbl">لاعب</div></div>
    <div class="stat-card"><div class="stat-num" id="statTop">0</div><div class="stat-lbl">أعلى نقاط</div></div>
    <div class="stat-card"><div class="stat-num" id="statAvg">0</div><div class="stat-lbl">متوسط النقاط</div></div>
  </div>

  <!-- PODIUM -->
  <div class="podium" id="podium"></div>

  <!-- FILTER -->
  <div class="filter-bar">
    <button class="filter-btn active" onclick="setFilter('all',this)">🌐 الكل</button>
    <button class="filter-btn" onclick="setFilter('خمّن صاحب الصوت',this)">🎤 خمّن الصوت</button>
    <button class="filter-btn" onclick="setFilter('أكمل الجملة',this)">📝 أكمل الجملة</button>
    <button class="filter-btn" onclick="setFilter('السرعة ⚡',this)">⚡ السرعة</button>
    <button class="filter-btn" style="margin-right:auto" onclick="refreshLB(this)" title="تحديث">🔄</button>
  </div>

  <!-- LEADERBOARD -->
  <div class="lb-wrap">
    <div class="lb-head">
      <div>#</div>
      <div>اللاعب</div>
      <div>اللعبة</div>
      <div>النقاط</div>
    </div>
    <div id="lbBody"></div>
  </div>

</div>

<script>
let allData   = [];
let curFilter = 'all';

// ── LOAD ──────────────────────────────────────
function load() {
  allData = JSON.parse(localStorage.getItem('lb_v2') || '[]');
  render();
}

// ── FILTER ────────────────────────────────────
function setFilter(f, btn) {
  curFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

// ── RENDER ────────────────────────────────────
function render() {
  let data = curFilter === 'all'
    ? [...allData]
    : allData.filter(e => e.game === curFilter);

  // De-dup: keep best score per player per game
  const seen = {};
  data = data.filter(e => {
    const k = e.name + '|' + e.game;
    if (seen[k] === undefined || e.score > seen[k]) { seen[k] = e.score; return true; }
    return false;
  });

  data.sort((a,b) => b.score - a.score);

  // Stats
  document.getElementById('statPlayers').textContent = data.length;
  document.getElementById('statTop').textContent     = data[0]?.score || 0;
  const avg = data.length ? Math.round(data.reduce((s,e)=>s+e.score,0)/data.length) : 0;
  document.getElementById('statAvg').textContent     = avg;

  // Podium
  renderPodium(data);

  // Table
  const body = document.getElementById('lbBody');
  if (!data.length) {
    body.innerHTML = `<div class="empty"><span class="empty-icon">👀</span>لا يوجد لاعبون بعد — <a href="games.html" style="color:var(--accent2)">العب الآن!</a></div>`;
    return;
  }

  body.innerHTML = data.map((e, i) => {
    const rank = i + 1;
    const medal = ['🥇','🥈','🥉'][i] || `<span style="color:var(--muted)">${rank}</span>`;
    const stars = i < 3 ? `<div class="star-row">${'⭐'.repeat(3-i)}</div>` : '';
    const linkHTML = e.link && e.link !== '#'
      ? `<div class="lb-player-link"><a href="${e.link}" target="_blank" rel="noopener">karboai ↗</a></div>`
      : '';
    const scoreBar = Math.round((e.score / (data[0]?.score||1)) * 100);
    return `
      <div class="lb-entry rank-${rank}" style="animation-delay:${i*0.04}s">
        <div class="lb-rank">${medal}</div>
        <div class="lb-player">
          <div class="lb-player-name">${escHtml(e.name)}</div>
          ${stars}
          ${linkHTML}
        </div>
        <div class="lb-game">${escHtml(e.game||'—')}</div>
        <div class="lb-score">${e.score.toLocaleString()}</div>
      </div>
    `;
  }).join('');
}

// ── PODIUM ────────────────────────────────────
function renderPodium(data) {
  const pod = document.getElementById('podium');
  if (data.length < 1) { pod.innerHTML = ''; return; }

  // Order: 2nd, 1st, 3rd
  const slots = [data[1], data[0], data[2]].map((e,i) => ({ e, i }));
  const classes  = ['pod-2','pod-1','pod-3'];
  const bclasses = ['pod-block-2','pod-block-1','pod-block-3'];
  const medals   = ['🥈','🥇','🥉'];
  const scores_c = ['var(--silver)','var(--gold)','var(--bronze)'];

  pod.innerHTML = slots.map(({e,i}) => {
    if (!e) return '<div class="podium-slot"></div>';
    return `
      <div class="podium-slot">
        <div class="pod-card ${classes[i]}">
          <span class="pod-medal">${medals[i]}</span>
          <div class="pod-name">${escHtml(e.name)}</div>
          <div class="pod-score" style="color:${scores_c[i]}">${e.score.toLocaleString()}</div>
          <div class="pod-game">${escHtml(e.game||'')}</div>
        </div>
        <div class="${bclasses[i]}"></div>
      </div>
    `;
  }).join('');
}

// ── REFRESH ───────────────────────────────────
function refreshLB(btn) {
  btn.style.display = 'inline-block';
  btn.classList.add('refreshing');
  setTimeout(() => { btn.classList.remove('refreshing'); load(); }, 600);
}

// ── UTILS ─────────────────────────────────────
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── DEMO DATA (for preview) ───────────────────
function loadDemoIfEmpty() {
  const lb = JSON.parse(localStorage.getItem('lb_v2') || '[]');
  if (lb.length === 0) {
    const demo = [
      { name:'أنيمي_كينغ', link:'https://karboai.com/u/animking', score:420, game:'خمّن صاحب الصوت', ts: Date.now()-1000 },
      { name:'صوتيات_برو',  link:'https://karboai.com/u/soundpro', score:380, game:'السرعة ⚡', ts: Date.now()-2000 },
      { name:'ناروتو_فان',  link:'https://karboai.com/u/narutofan', score:310, game:'أكمل الجملة', ts: Date.now()-3000 },
      { name:'ون_بيس_لوفي', link:'https://karboai.com/u/luffy', score:290, game:'خمّن صاحب الصوت', ts: Date.now()-4000 },
      { name:'أوست_هانتر',  link:'', score:250, game:'السرعة ⚡', ts: Date.now()-5000 },
      { name:'سيمبا_2025',  link:'', score:180, game:'أكمل الجملة', ts: Date.now()-6000 },
    ];
    localStorage.setItem('lb_v2', JSON.stringify(demo));
  }
}

// ── INIT ──────────────────────────────────────
loadDemoIfEmpty();
load();

// Auto-refresh every 30s
setInterval(load, 30000);
</script>
</body>
</html>
