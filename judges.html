<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏆 لوحة المتصدرين — لجنة الصوتيات</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #07060f;
  --surface: #0f0e1e;
  --card: #13122a;
  --border: rgba(255,255,255,0.07);
  --gold:   #ffd600;
  --silver: #c0c0d0;
  --bronze: #cd7f32;
  --accent: #e040fb;
  --accent2: #00e5ff;
  --text: #f0f0ff;
  --muted: #6b7280;
  --green: #00e676;
  --stage1: #00e5ff;
  --stage2: #ffd600;
  --stage3: #ff6d00;
  --stage4: #e040fb;
}

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: 'Tajawal', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* Stars BG */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: radial-gradient(1.5px 1.5px at 10% 20%, rgba(255,255,255,.35) 0%, transparent 100%),
    radial-gradient(1px 1px at 30% 60%, rgba(255,255,255,.2) 0%, transparent 100%),
    radial-gradient(2px 2px at 60% 10%, rgba(255,255,255,.25) 0%, transparent 100%),
    radial-gradient(1px 1px at 80% 80%, rgba(255,255,255,.15) 0%, transparent 100%),
    radial-gradient(1.5px 1.5px at 50% 50%, rgba(255,255,255,.2) 0%, transparent 100%),
    radial-gradient(1px 1px at 90% 30%, rgba(255,255,255,.3) 0%, transparent 100%);
  background-size: 400px 400px;
  pointer-events: none;
  z-index: 0;
}

body::after {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse at 50% 0%, rgba(224,64,251,.14) 0%, transparent 55%),
    radial-gradient(ellipse at 0% 100%, rgba(0,229,255,.08) 0%, transparent 45%);
  pointer-events: none;
  z-index: 0;
}

.wrap { max-width: 850px; margin: 0 auto; padding: 20px 16px; position: relative; z-index: 1; }

/* ── HEADER ── */
header {
  text-align: center;
  padding: 40px 0 32px;
  animation: slideDown .7s cubic-bezier(.22,1,.36,1);
}

.trophy-icon {
  font-size: 3.5rem;
  display: block;
  margin-bottom: 10px;
  filter: drop-shadow(0 0 20px rgba(255,214,0,.6));
  animation: trophyFloat 3s ease-in-out infinite;
}

@keyframes trophyFloat {
  0%,100%{transform:translateY(0) rotate(-3deg)}
  50%{transform:translateY(-8px) rotate(3deg)}
}

header h1 {
  font-size: clamp(1.8rem, 5vw, 2.6rem);
  font-weight: 900;
  background: linear-gradient(135deg, #ffd600, #ff6d00, #e040fb);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 6px;
}

header p { color: var(--muted); font-size: .9rem; }

.header-link {
  display: inline-flex; align-items: center; gap: 8px;
  margin-top: 16px;
  padding: 10px 22px;
  border-radius: 50px;
  background: linear-gradient(135deg, rgba(224,64,251,.2), rgba(0,229,255,.15));
  border: 1px solid rgba(224,64,251,.35);
  color: var(--accent);
  text-decoration: none;
  font-weight: 700;
  font-size: .9rem;
  transition: all .3s;
}
.header-link:hover { transform: translateY(-2px); box-shadow: 0 0 20px rgba(224,64,251,.3); }

/* ── PODIUM ── */
.podium {
  display: flex;
  align-items: flex-end;
  justify-content: center;
  gap: 14px;
  margin: 30px 0;
  animation: fadeUp .7s ease .2s both;
}

.podium-slot {
  flex: 1;
  max-width: 180px;
  text-align: center;
}

.pod-card {
  border-radius: 18px 18px 4px 4px;
  padding: 18px 10px 14px;
  position: relative;
  overflow: hidden;
  transition: transform .3s;
}
.pod-card:hover { transform: translateY(-4px); }

.pod-card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(to bottom, rgba(255,255,255,.07), transparent);
  pointer-events: none;
}

.pod-1 { background: linear-gradient(160deg, rgba(255,214,0,.18), rgba(255,140,0,.08)); border: 1.5px solid rgba(255,214,0,.4); }
.pod-2 { background: linear-gradient(160deg, rgba(192,192,210,.12), rgba(150,150,180,.06)); border: 1.5px solid rgba(192,192,210,.3); }
.pod-3 { background: linear-gradient(160deg, rgba(205,127,50,.12), rgba(180,100,30,.06)); border: 1.5px solid rgba(205,127,50,.3); }

.pod-medal { font-size: 2rem; display: block; margin-bottom: 8px; }
.pod-name  { font-size: .85rem; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
.pod-score { font-size: 1.4rem; font-weight: 900; }
.pod-1 .pod-score { color: var(--gold); }
.pod-2 .pod-score { color: var(--silver); }
.pod-3 .pod-score { color: var(--bronze); }
.pod-game  { font-size: .7rem; color: var(--muted); margin-top: 4px; }

.pod-block {
  height: 60px;
  border-radius: 0 0 8px 8px;
  margin-top: 4px;
}
.pod-block-1 { background: linear-gradient(to bottom, rgba(255,214,0,.3), rgba(255,140,0,.1)); height: 70px; }
.pod-block-2 { background: linear-gradient(to bottom, rgba(192,192,210,.2), rgba(150,150,180,.05)); height: 50px; }
.pod-block-3 { background: linear-gradient(to bottom, rgba(205,127,50,.2), rgba(180,100,30,.05)); height: 40px; }

/* ── FILTER BAR ── */
.filter-bar {
  display: flex;
  gap: 8px;
  margin-bottom: 18px;
  flex-wrap: wrap;
  animation: fadeUp .5s ease .3s both;
}

.filter-btn {
  padding: 8px 18px;
  border-radius: 50px;
  border: 1.5px solid var(--border);
  background: var(--card);
  color: var(--muted);
  font-family: 'Tajawal', sans-serif;
  font-size: .85rem;
  font-weight: 700;
  cursor: pointer;
  transition: all .3s;
}
.filter-btn:hover { border-color: var(--accent); color: var(--text); }
.filter-btn.active { background: rgba(224,64,251,.15); border-color: var(--accent); color: var(--accent); }

/* فلاتر النوع */
.filter-type { background: rgba(0,229,255,.1); border-color: rgba(0,229,255,.3); color: var(--accent2); }

/* فلاتر المراحل */
.filter-stage-1 { background: rgba(0,229,255,.1); color: var(--stage1); border-color: var(--stage1); }
.filter-stage-2 { background: rgba(255,214,0,.1); color: var(--stage2); border-color: var(--stage2); }
.filter-stage-3 { background: rgba(255,109,0,.1); color: var(--stage3); border-color: var(--stage3); }
.filter-stage-4 { background: rgba(224,64,251,.1); color: var(--stage4); border-color: var(--stage4); }

/* ── LEADERBOARD TABLE ── */
.lb-wrap {
  background: var(--card);
  border: 1px solid rgba(224,64,251,.2);
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 0 40px rgba(224,64,251,.12);
  animation: fadeUp .5s ease .35s both;
  margin-bottom: 24px;
}

.lb-head {
  display: grid;
  grid-template-columns: 56px 1fr 120px 110px 100px;
  gap: 0;
  padding: 12px 20px;
  background: rgba(224,64,251,.08);
  border-bottom: 1px solid var(--border);
  font-size: .75rem;
  color: var(--muted);
  letter-spacing: 1px;
  text-transform: uppercase;
}

.lb-entry {
  display: grid;
  grid-template-columns: 56px 1fr 120px 110px 100px;
  gap: 0;
  padding: 15px 20px;
  border-bottom: 1px solid var(--border);
  align-items: center;
  transition: background .2s;
  animation: fadeUp .4s ease both;
}
.lb-entry:last-child { border-bottom: none; }
.lb-entry:hover { background: rgba(255,255,255,.025); }

.lb-entry.rank-1 { background: rgba(255,214,0,.05); }
.lb-entry.rank-2 { background: rgba(192,192,210,.04); }
.lb-entry.rank-3 { background: rgba(205,127,50,.04); }

.lb-rank { font-size: 1.15rem; font-weight: 900; text-align: center; }
.rank-1 .lb-rank { color: var(--gold); }
.rank-2 .lb-rank { color: var(--silver); }
.rank-3 .lb-rank { color: var(--bronze); }

.lb-player { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.lb-player-name { font-weight: 900; font-size: .95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lb-player-link { font-size: .72rem; }
.lb-player-link a { color: var(--accent2); text-decoration: none; }
.lb-player-link a:hover { text-decoration: underline; }

/* أعمدة النوع والمرحلة */
.lb-type { font-size: .78rem; color: var(--accent2); background: rgba(0,229,255,.1); padding: 2px 6px; border-radius: 10px; text-align: center; }
.lb-stage { font-size: .78rem; font-weight: bold; padding: 2px 6px; border-radius: 10px; text-align: center; }
.stage-s1 { background: rgba(0,229,255,.15); color: var(--stage1); }
.stage-s2 { background: rgba(255,214,0,.15); color: var(--stage2); }
.stage-s3 { background: rgba(255,109,0,.15); color: var(--stage3); }
.stage-s4 { background: rgba(224,64,251,.15); color: var(--stage4); }

.lb-score { font-size: 1.2rem; font-weight: 900; color: var(--gold); text-align: left; }

/* Stars for top 3 */
.star-row { display: flex; gap: 2px; margin-top: 3px; }
.star { font-size: .6rem; }

/* ── STATS BAR ── */
.stats-bar {
  display: grid;
  grid-template-columns: repeat(4,1fr);
  gap: 12px;
  margin-bottom: 24px;
  animation: fadeUp .5s ease .4s both;
}

.stat-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 16px;
  text-align: center;
}
.stat-num { font-size: 1.7rem; font-weight: 900; color: var(--accent2); }
.stat-lbl { font-size: .75rem; color: var(--muted); margin-top: 3px; }

/* ── EMPTY STATE ── */
.empty {
  text-align: center;
  padding: 50px 20px;
  color: var(--muted);
}
.empty-icon { font-size: 3rem; display: block; margin-bottom: 12px; opacity: .5; }

/* ── BACK LINK ── */
.back-link {
  display: inline-flex; align-items: center; gap: 6px;
  color: var(--accent);
  text-decoration: none;
  font-weight: 700;
  font-size: .9rem;
  margin-bottom: 20px;
  transition: all .3s;
  animation: fadeUp .5s ease .1s both;
}
.back-link:hover { transform: translateX(4px); }

/* Animations */
@keyframes slideDown { from{opacity:0;transform:translateY(-20px)} to{opacity:1;transform:translateY(0)} }
@keyframes fadeUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }

/* Responsive */
@media(max-width:700px){
  .lb-head, .lb-entry { grid-template-columns: 44px 1fr 90px; }
  .lb-head > *:nth-child(4), .lb-entry > *:nth-child(4),
  .lb-head > *:nth-child(5), .lb-entry > *:nth-child(5) { display:none; }
  .podium { gap: 8px; }
  .stats-bar { grid-template-columns: repeat(2,1fr); }
}

/* Refresh animation */
.refreshing { animation: spin .6s linear; }
@keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
</style>
</head>
<body>
<div class="wrap">

  <!-- HEADER -->
  <header>
    <span class="trophy-icon">🏆</span>
    <h1>لوحة المتصدرين</h1>
    <p>لجنة الصوتيات — أمينو</p>
    <a class="header-link" href="games.html">🎮 العب الآن</a>
  </header>

  <!-- STATS -->
  <div class="stats-bar" id="statsBar">
    <div class="stat-card"><div class="stat-num" id="statPlayers">0</div><div class="stat-lbl">لاعب</div></div>
    <div class="stat-card"><div class="stat-num" id="statTop">0</div><div class="stat-lbl">أعلى نقاط</div></div>
    <div class="stat-card"><div class="stat-num" id="statAvg">0</div><div class="stat-lbl">متوسط النقاط</div></div>
    <div class="stat-card"><div class="stat-num" id="statTypes">0</div><div class="stat-lbl">مجالات مختلفة</div></div>
  </div>

  <!-- PODIUM -->
  <div class="podium" id="podium"></div>
